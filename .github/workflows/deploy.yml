name: Deploy to wordpress.org

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify version numbers agree
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The version lives in four places. A release that disagrees with itself
      # ships a package wordpress.org will serve under the wrong number, which
      # cannot be undone without a new release, so this runs before anything
      # touches SVN.
      - name: Compare the tag, the plugin header, the constant and the stable tag
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          HEADER_VERSION="$(sed -n 's/^ \* Version:[[:space:]]*\(.*\)$/\1/p' table-reflow.php | head -n1 | tr -d '[:space:]')"
          CONST_VERSION="$(sed -n "s/.*TABLE_REFLOW_VERSION'[^']*'\([^']*\)'.*/\1/p" table-reflow.php | head -n1)"
          STABLE_TAG="$(sed -n 's/^Stable tag:[[:space:]]*\(.*\)$/\1/p' readme.txt | head -n1 | tr -d '[:space:]')"

          echo "Git tag:        ${TAG_VERSION}"
          echo "Plugin header:  ${HEADER_VERSION}"
          echo "PHP constant:   ${CONST_VERSION}"
          echo "Stable tag:     ${STABLE_TAG}"

          FAILED=0
          for FOUND in "${HEADER_VERSION}" "${CONST_VERSION}" "${STABLE_TAG}"; do
            if [ "${FOUND}" != "${TAG_VERSION}" ]; then
              FAILED=1
            fi
          done

          if [ "${FAILED}" -ne 0 ]; then
            echo "::error::Version mismatch. The Git tag, the plugin header, TABLE_REFLOW_VERSION and the readme stable tag must all match."
            exit 1
          fi

          echo "All four version numbers agree."

      # Checked here, before anything is published, rather than at release time.
      # By the time the release step runs, the package is already live on SVN and
      # a missing section can no longer be fixed without cutting a new version.
      - name: Check the changelog has a section for this version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          if ! grep -qF "## [${VERSION}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section. Add the release notes before tagging."
            exit 1
          fi

          echo "Changelog section found for ${VERSION}."

  deploy:
    name: Publish to the plugin directory
    runs-on: ubuntu-latest
    needs: verify-version

    # Needed to create the GitHub release at the end of the job. Everything
    # else in this workflow only reads the repository.
    permissions:
      contents: write

    environment:
      name: wordpress-org
      url: https://wordpress.org/plugins/table-reflow/

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # SVN_USERNAME and SVN_PASSWORD are created by hand by the maintainer, in
      # Settings > Secrets and variables > Actions. Nothing here generates them.
      # See CONTRIBUTING.md.
      # Pinned to a commit, not to the mutable `stable` branch. This step runs
      # with the SVN credentials, so anything that branch points at tomorrow
      # would publish under this account. Bump the SHA deliberately, after
      # reading the diff.
      # build/ n'est pas versionné : les artefacts se reconstruisent, ils ne se
      # commitent pas. Le paquet publié en a besoin, donc la construction a lieu
      # ici, avant tout ce qui inspecte le paquet.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Build the assets
        run: |
          npm ci
          npm run build

      - name: Deploy to the wordpress.org SVN repository
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable, as of 2026-09-18
        with:
          generate-zip: true
        env:
          SLUG: table-reflow
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

      # The release notes come from CHANGELOG.md rather than being written by
      # hand, so the tag, the directory and the release can never tell three
      # different stories.
      - name: Extract the release notes for this version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          awk -v v="${VERSION}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          # verify-version already refused to go further without this section,
          # so an empty file here means the extraction itself broke.
          if [ ! -s release-notes.md ]; then
            echo "::error::Could not extract the CHANGELOG.md section for ${VERSION}."
            exit 1
          fi

          cat release-notes.md

      # gh is preinstalled on the runner, so this needs no third-party action
      # and nothing further to pin.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.deploy.outputs.zip-path }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag \
            "${ZIP_PATH}#table-reflow-${VERSION}.zip"
